<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraumaSoft - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header i {
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .login-header h2 {
            color: #2c3e50;
            font-weight: 600;
        }
        
        .login-header p {
            color: #7f8c8d;
        }
        
        .form-control {
            height: 45px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }
        
        .btn-login {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-login:hover {
            background-color: #1a252f;
        }
        
        .btn-register {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        
        .btn-register:hover {
            background-color: #2980b9;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }
        
        .forgot-password a {
            color: #3498db;
            text-decoration: none;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #e74c3c;
            background-color: #fadbd8;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }
        
        .loading i {
            font-size: 2rem;
            color: #3498db;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #7f8c8d;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #ddd;
            z-index: 1;
        }
        
        .divider span {
            background-color: white;
            padding: 0 10px;
            position: relative;
            z-index: 2;
        }
        
        .features {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        
        .features h4 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .feature-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .feature-icons i {
            font-size: 1.5rem;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-bone"></i>
                <h2>TraumaSoft</h2>
                <p>Gestion de Cabinet de Traumatologie</p>
            </div>
            
            <div class="error-message" id="error-message"></div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Entrez votre email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="password" placeholder="Entrez votre mot de passe" required>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                </div>
                
                <button type="submit" class="btn-login">
                    <span id="login-text">Se connecter</span>
                    <i class="fas fa-spinner fa-spin d-none" id="login-spinner"></i>
                </button>
                
                <div class="loading" id="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Connexion en cours...</p>
                </div>
            </form>
            
            <div class="divider">
                <span>ou</span>
            </div>
            
            <button class="btn-register" onclick="window.location.href='register.html'">
                Créer un compte
            </button>
            
            <div class="forgot-password">
                <a href="forgot-password.html">Mot de passe oublié ?</a>
            </div>
            
            <div class="features">
                <h4>Fonctionnalités</h4>
                <div class="feature-icons">
                    <i class="fas fa-user-injured"></i>
                    <i class="fas fa-calendar-alt"></i>
                    <i class="fas fa-brain"></i>
                    <i class="fas fa-chart-line"></i>
                </div>
                <p>Gestion complète avec intelligence artificielle</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('error-message');
            const loginText = document.getElementById('login-text');
            const loginSpinner = document.getElementById('login-spinner');
            const loading = document.getElementById('loading');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (!email || !password) {
                    showError('Veuillez remplir tous les champs');
                    return;
                }
                
                // Afficher le chargement
                loginText.classList.add('d-none');
                loginSpinner.classList.remove('d-none');
                loading.style.display = 'block';
                
                try {
                    const api = new TraumaSoftAPI();
                    const response = await api.login(email, password);
                    
                    if (response && response.success) {
                        // Connexion réussie
                        window.location.href = 'index.html';
                    } else {
                        showError(response.message || 'Identifiants invalides');
                    }
                } catch (error) {
                    showError('Erreur de connexion: ' + error.message);
                } finally {
                    loginText.classList.remove('d-none');
                    loginSpinner.classList.add('d-none');
                    loading.style.display = 'none';
                }
            });
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                
                // Masquer après 5 secondes
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
