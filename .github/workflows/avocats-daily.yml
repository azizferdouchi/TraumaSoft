name: avocats-daily

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collecte sans envoi d'email"
        type: boolean
        default: false

permissions: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le projet
        run: pip install -e workflows/avocats-casa
      - name: Collecte et envoi
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python workflows/avocats-casa/run_daily.py --dry-run
          else
            python workflows/avocats-casa/run_daily.py
          fi
