[project]
name = "avocats-casa"
version = "0.1.0"
description = "Workflow quotidien : base de contacts des avocats de Casablanca envoyée par email"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=0.1",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.pytest.ini_options]
testpaths = ["apps/worker/tests"]
